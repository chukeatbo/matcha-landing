services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: matcha-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ORIGIN=https://your-domain.com
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/healthz']
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: matcha-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      # - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment once you have TLS certs (see README for certbot instructions)
      # - ./nginx/certs:/etc/nginx/certs:ro
